  <text class="ink module-title" x="105" y="255">Platform</text>
  <text class="muted module-sub" x="105" y="282">Windows en .NET omgeving</text>

  <rect x="105" y="310" width="250" height="82" rx="13" class="card"/>
  <rect x="105" y="310" width="9" height="82" rx="9" class="slate"/>
  <text class="ink card-title" x="132" y="340">.NET 10 + Windows UI</text>
  <text class="muted card-text" x="132" y="362">Vensters, controls,</text>
  <text class="muted card-text" x="132" y="381">dialogen en drawing.</text>

  <rect x="105" y="420" width="250" height="82" rx="13" class="card"/>
  <rect x="105" y="420" width="9" height="82" rx="9" class="slate"/>
