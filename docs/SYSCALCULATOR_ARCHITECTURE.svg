  <text class="muted card-text" x="132" y="472">HTML help, formulekaart</text>
  <text class="muted card-text" x="132" y="491">en previews.</text>

  <rect x="105" y="530" width="250" height="82" rx="13" class="card"/>
  <rect x="105" y="530" width="9" height="82" rx="9" class="slate"/>
  <text class="ink card-title" x="132" y="560">Windows Clipboard</text>
  <text class="muted card-text" x="132" y="582">Copy/paste</text>
  <text class="muted card-text" x="132" y="601">en tabeldata.</text>

