<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1850" role="img" aria-labelledby="title desc">
  <title id="title">Syscalculator totale architectuur</title>
  <desc id="desc">Overzicht van de hoofdapp, Tiedragon Library, NOD engine, resources, tests en installer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill:#f8fafc; }
      .ink { fill:#0f172a; font-family:"Segoe UI", Arial, sans-serif; }
      .muted { fill:#475569; font-family:"Segoe UI", Arial, sans-serif; }
      .title { font-size:44px; font-weight:700; }
      .subtitle { font-size:20px; }
      .module-title { font-size:28px; font-weight:650; }
      .module-sub { font-size:15px; }
      .card-title { font-size:15px; font-weight:650; }
      .card-text { font-size:12.5px; }
      .platform { fill:#f1f5f9; stroke:#475569; stroke-width:2.4; }
      .app { fill:#eff6ff; stroke:#2563eb; stroke-width:2.4; }
      .res { fill:#fffbeb; stroke:#d97706; stroke-width:2.4; }
      .side { fill:#fff1f2; stroke:#e11d48; stroke-width:2.4; }
      .libs { fill:#faf5ff; stroke:#7c3aed; stroke-width:2.4; }
      .core { fill:#f0fdf4; stroke:#16a34a; stroke-width:2.4; }
      .card { fill:#fff; stroke:#cbd5e1; stroke-width:1.3; }
      .blue { fill:#2563eb; }
      .green { fill:#16a34a; }
      .amber { fill:#d97706; }
      .violet { fill:#7c3aed; }
      .cyan { fill:#0891b2; }
      .rose { fill:#e11d48; }
      .slate { fill:#475569; }
      .line { stroke:#475569; stroke-width:3.5; fill:none; marker-end:url(#arrow); }
    </style>
