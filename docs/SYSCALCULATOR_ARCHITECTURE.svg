  <rect class="bg" x="0" y="0" width="2400" height="1850"/>
  <text class="ink title" x="70" y="90">Syscalculator totale architectuur</text>
  <text class="muted subtitle" x="74" y="126">Hoofdapp, Tiedragon Library, NOD-engine, runtime resources, taal/config, tests/demo en installer in een overzicht.</text>

  <rect x="1480" y="42" width="770" height="104" rx="18" class="card" stroke-width="2"/>
  <text class="muted card-text" x="1510" y="72">Solution / build output</text>
  <text class="ink card-title" x="1510" y="101">Syscalculator App + Tiedragon Library</text>
  <text class="muted card-text" x="1510" y="126">De app verwijst naar ClipboardConvert, Graph2D, Help, NodSystem Core en ToolEditor.</text>

