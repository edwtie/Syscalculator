<h2>Symbols</h2><table><tr><th>Command</th><th>Position</th><th>Example</th></tr><tr><td>Symb1</td><td>left of input</td><td>DM 25</td></tr><tr><td>Symb2</td><td>left of output</td><td>EUR 25</td></tr><tr><td>Symb3</td><td>right of input</td><td>25 kg</td></tr><tr><td>Symb4</td><td>right of output</td><td>25 lb</td></tr></table><p>Usually choose left or right per value, not both, to avoid duplicate text such as <code>DM 25 DM</code>.</p>
