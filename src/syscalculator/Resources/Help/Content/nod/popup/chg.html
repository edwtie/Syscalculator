<div class="title">chg</div><div class="syntax">chg "old-prefix","new-prefix"</div><div><b>Meaning:</b> changes the start of text, for example codes or phone numbers.</div><div><b>Example:</b> <code>chg "01751-xxxxx","070-51xxxxx"</code> turns <code>01751-12345</code> into <code>070-5112345</code>.</div><div><b>Patterns:</b> <code>x</code> may mark the remaining digits. If multiple rules match, the longest/most specific prefix wins.</div>
