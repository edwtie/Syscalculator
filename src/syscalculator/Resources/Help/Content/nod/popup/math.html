<div class="title">math</div><div class="syntax">math ans * 1.8</div><div><b>Meaning:</b> runs a calculation step with <code>ans</code> as current value.</div><div><b>Examples:</b> <code>math ans + 32</code>, <code>math length(vec(3,4))</code>, <code>math det(mat2(1,2,3,4))</code>, <code>math mean(2,4,4,4,5,5,7,9)</code>.</div><div><b>Shortcut:</b> <code>math vec 3 4</code> means <code>math length(vec(3,4))</code>.</div>
