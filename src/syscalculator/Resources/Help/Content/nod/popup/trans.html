<div class="title">trans</div><div class="syntax">trans "old value","new value"</div><div><b>Meaning:</b> translates a complete value. NOD 1.0 matches exactly; NOD 2.0 can then match smarter compact text.</div><div><b>Example:</b> <code>trans "dank je","thank you"</code> also translates input such as <code>dank_je</code>.</div>
