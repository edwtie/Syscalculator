<div class="title">phoneformat</div><div class="syntax">phoneformat country NL</div><div><b>Meaning:</b> normalizes phone numbers inside a <code>field</code> block in <code>mode data</code>.</div><div><b>Example:</b> <code>phoneformat remove_spaces true</code> removes spaces; <code>phoneformat normalize_international true</code> normalizes Dutch international notation.</div>
