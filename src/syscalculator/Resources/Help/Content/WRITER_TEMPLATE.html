<!--
  Schrijvers-template voor help-pagina's.

  Dit bestand is alleen een voorbeeld.
  Kopieer de vorm gerust naar een echte help-pagina.

  Belangrijk:
  - Alles tussen < en > is meestal opmaak.
  - Alles tussen [ en ] is tekst uit een taalbestand.
  - Alles tussen { en } wordt door het programma ingevuld.
-->

<!-- Titel van dit hoofdstuk -->
<h2>[help.example.section_title]</h2>

<!-- Gewone alinea -->
<p>[help.example.intro]</p>

<!-- Lijst met stappen -->
<ol>
  <li>[help.example.step_one]</li>
  <li>[help.example.step_two]</li>
  <li>[help.example.step_three]</li>
</ol>

<!-- Screenshot of dynamische inhoud -->
{NodEditorScreenshot}

<!-- Onderschrift bij screenshot -->
<p class="shot-caption">[help.example.screenshot_caption]</p>

<!-- Extra tip -->
<p>[help.example.tip]</p>
