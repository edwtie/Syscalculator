<h1>Tip Of Opmerking</h1>

<p>Gebruik een tip voor uitleg die handig is, maar niet gevaarlijk.</p>

<pre>&lt;div class="notice"&gt;
  &lt;b&gt;[help.note.title]&lt;/b&gt; [help.note.text]
&lt;/div&gt;</pre>

<p>Voorbeeld in <code>.lng</code>:</p>

<pre>help.note.title=Tip:
help.note.text=Gebruik korte voorbeelden wanneer je een command uitlegt.</pre>
